<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Crypto Tracker</title>
</head>
<body>
    <h1 id="siteHeader">Crypto Coin Tracker</h1>


    <div id="infoContainer">

        <h3 style="font-size: 15px; text-align:center; ">Search a coin to analyse:</h3>


        <div id="coinSearchContainer">
            <input type="text" id="coinSearch" placeholder="e.g. Bitcoin">
            <ul id="coinResults"></ul>
        </div>


        <div id="chartRow">
            <div id="timePeriodButtonContainer">
                <button class="timePeriodButton" onClick="changeTimeSeriesLength(360, this)">1yr</button>
                <button class="timePeriodButton" onClick="changeTimeSeriesLength(180, this)">6mo</button>
                <button class="timePeriodButton" onClick="changeTimeSeriesLength(30, this)">1mo</button>
                <button class="timePeriodButton" onClick="changeTimeSeriesLength(7, this)">1w</button>
                <button class="timePeriodButton active" onClick="changeTimeSeriesLength(1, this)">1d</button>
            </div>


            <div class="chart-container">
                <canvas id="priceChart">This browser doesn't support canvas HTML tags</canvas>
            </div>

            <div id="coinStats">
                <div style="display: flex; gap: 10px;">
                    <img id="coinLogo" src="">
                    <span id="coinPrice" style="font-size: 40px; font-weight: 900;"></span>
                </div>
                <p style="margin-top: 20px;">Market Cap: <span id="marketCap"></span></p>
                <p>Market Cap Rank: <span id="marketCapRank"></span></p>
                <p>24hr Change: <span id="24hrChange"></span></p>
            </div>
        </div>


        <p id="apiErrorText" style="text-align: center; margin-top: 10px;"></p>


        
    </div>




    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

    
</body>
</html>
